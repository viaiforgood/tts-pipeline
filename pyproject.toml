[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-pipeline"
version = "0.1.0"
description = "Text-to-speech pipeline for generating narrated audio, mixing background music, and rendering audio/video assets for publishing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "VI AI for Good Foundation" }
]
keywords = ["tts", "text-to-speech", "audio", "video", "ffmpeg", "publishing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
tts-pipeline = "tts_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/viaiforgood/tts-pipeline"
Repository = "https://github.com/viaiforgood/tts-pipeline"
Issues = "https://github.com/viaiforgood/tts-pipeline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
